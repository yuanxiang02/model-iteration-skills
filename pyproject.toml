[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "model-iteration-harness"
version = "0.5.0"
description = "Controlled model iteration with reviewed boundaries, bounded exploration and fixed evaluation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.urls]
Repository = "https://github.com/yuanxiang02/model-iteration-skills"

[project.scripts]
mih = "mih.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mih = ["explorer_static/*", "dsh_plugin.mjs"]
