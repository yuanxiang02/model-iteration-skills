name: Core behavior checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
            suite: full
          - os: ubuntu-24.04
            python: '3.12'
            suite: full
          - os: macos-15
            python: '3.12'
            suite: full
          # Windows coverage is deliberately narrower: several lifecycle checks
          # depend on POSIX process groups and file sharing (see
          # docs/platform-support.md). This job still guards the things that
          # broke silently before: the package importing at all, the platform
          # primitives, and the DSH tool contracts.
          - os: windows-latest
            python: '3.12'
            suite: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - name: Import the runtime (catches POSIX-only imports)
        if: matrix.suite == 'windows'
        run: python -c "import mih, mih.core, mih.worker, mih.storage, mih.dsh; print('imports ok')"
      - name: Full suite
        if: matrix.suite == 'full'
        run: python -m unittest discover -s tests -v
      - name: Platform primitives
        if: matrix.suite == 'windows'
        run: python -m unittest discover -s tests -p "test_platform.py" -v
      - name: DSH tool contracts
        if: matrix.suite == 'windows'
        run: python -m unittest discover -s tests -p "test_dsh_tools.py" -v
